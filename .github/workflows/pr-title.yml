name: PR title

# Squash-merging uses the PR title as the commit subject, so the title has to
# satisfy Conventional Commits for the same reason the commits do: it is what
# ends up in the history and what semantic-release reads.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same set as @commitlint/config-conventional, which the platform
          # repo uses, so a contributor moving between the two sees one rule.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Scopes match the internal package layout; left optional because a
          # cross-cutting change has no single scope.
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid.
            It must start with a lowercase letter and must not end with a period.
