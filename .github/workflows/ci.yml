name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # go-github/v92 requires Go 1.26.
  GO_VERSION: '1.27'

jobs:
  lint:
    name: Vet & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      # Three constraints have to line up here, and getting any one wrong
      # fails before a single linter runs:
      #
      #   1. .golangci.yml uses the v2 config schema, which needs
      #      golangci-lint v2. Action v6 was the last major to install v1, and
      #      its "latest" resolved against the v1 module path (v1.64.8).
      #   2. golangci-lint refuses to run when the Go version it was BUILT
      #      with is older than the `go` directive in go.mod. go.mod targets
      #      1.26.0; v2.14.0's binaries are built with go1.27.0, but v2.6.2's
      #      were built with go1.25.3 and would fail. Check when bumping:
      #      `go version $(which golangci-lint)`.
      #   3. The version is pinned, not `latest`, so a new release adding
      #      rules cannot fail an unrelated pull request.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Defaults cap repeats of the same issue at 3, which hides the real
          # scale of a failure. Report everything.
          args: --max-same-issues=0 --max-issues-per-linter=0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
