version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - gosec

  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Tests legitimately ignore errors on fixture setup and construct
      # deliberately bad input.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

      # storetest is an in-memory fake whose exported methods exist only to
      # satisfy store.Store, which already documents each one. Restating those
      # contracts on ten methods would be noise, not documentation.
      - path: internal/store/storetest/
        text: "exported method Fake\\."
        linters:
          - revive

formatters:
  enable:
    - gofmt
